[platformio]
default_envs = t5s3-pro
build_cache_dir = .cache
extra_configs = platformio.local.ini
boards_dir = lib/Board_T5S3/boards

[crosspoint]
version = 1.0.3

[base]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Ilib/I2CMasterCompat/include
  -Ilib/Board
  -Ilib/Board_T5S3
  -Ilib/Board_EPD47
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/merge_firmware.py

; Libraries
lib_deps =
  greiman/SdFat @ ^2.3.1
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  https://github.com/bitbank2/JPEGDEC.git#86282979
  links2004/WebSockets @ 2.7.3
[t5s3]
lib_deps =
  ${base.lib_deps}
  https://github.com/m5stack/M5GFX.git#0.2.20
lib_ignore =
  Board_EPD47

[epd47]
lib_deps =
  ${base.lib_deps}
  https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#f0ff4a98e5cb60f98a46dbc09b511dc4534aae43
lib_ignore =
  Board_T5S3
  bq25896
  bq27220

[env:t5s3-pro]
extends = base
board = t5s3-pro
lib_deps = ${t5s3.lib_deps}
lib_ignore = ${t5s3.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_T5S3_PRO
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

[env:lilygo-epd47-s3]
extends = base
board = lilygo-epd47-s3
lib_deps = ${epd47.lib_deps}
lib_ignore = ${epd47.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_LILYGO_EPD47_S3
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

; Compatibility alias for existing local workflows.
[env:default]
extends = base
board = lilygo-epd47-s3
lib_deps = ${epd47.lib_deps}
lib_ignore = ${epd47.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_LILYGO_EPD47_S3
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

[env:gh_release]
extends = base
board = t5s3-pro
lib_deps = ${t5s3.lib_deps}
lib_ignore = ${t5s3.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_T5S3_PRO
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
board = t5s3-pro
lib_deps = ${t5s3.lib_deps}
lib_ignore = ${t5s3.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_T5S3_PRO
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds  

[env:slim]
extends = base
board = t5s3-pro
lib_deps = ${t5s3.lib_deps}
lib_ignore = ${t5s3.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_T5S3_PRO
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

[env:lilygo-epd47-s3-release]
extends = base
board = lilygo-epd47-s3
lib_deps = ${epd47.lib_deps}
lib_ignore = ${epd47.lib_ignore}
build_flags =
  ${base.build_flags}
  -DBOARD_LILYGO_EPD47_S3
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1

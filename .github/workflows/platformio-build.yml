name: PlatformIO Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/platformio-build.yml"
      - "src/**"
      - "lib/**"
      - "scripts/**"
      - "test/**"
      - "platformio.ini"
      - "partitions.csv"
  pull_request:
    paths:
      - ".github/workflows/platformio-build.yml"
      - "src/**"
      - "lib/**"
      - "scripts/**"
      - "test/**"
      - "platformio.ini"
      - "partitions.csv"
  workflow_dispatch:

concurrency:
  group: platformio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: t5s3-pro
            board_id: t5s3-pro
            firmware_name: firmware-t5s3-pro.bin
            merged_firmware_name: firmware-t5s3-pro-merged.bin
          - environment: lilygo-epd47-s3
            board_id: lilygo-epd47-s3
            firmware_name: firmware-lilygo-epd47-s3.bin
            merged_firmware_name: firmware-lilygo-epd47-s3-merged.bin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Stage board-qualified firmware
        run: |
          grep -a -q "CROSSPOINT_BOARD_ID:${{ matrix.board_id }}" ".pio/build/${{ matrix.environment }}/firmware.bin"
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" "dist/${{ matrix.firmware_name }}"
          cp ".pio/build/${{ matrix.environment }}/firmware-merged.bin" "dist/${{ matrix.merged_firmware_name }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board_id }}
          path: |
            dist/${{ matrix.firmware_name }}
            dist/${{ matrix.merged_firmware_name }}
          if-no-files-found: error

  host-tests:
    name: Host parser tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run streaming JSON parser tests
        run: bash test/run_streaming_json_parser_test.sh

      - name: Run release JSON parser tests
        run: bash test/run_release_json_parser_test.sh
